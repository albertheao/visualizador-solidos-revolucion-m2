s.push(new THREE.Vector3(6*t-3,r*Math.cos(angle),r*Math.sin(angle)))}surfaceGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(edgePoints),new THREE.LineBasicMaterial({color:0x087f89,linewidth:2})))}renderer.render(scene,camera);return true}
function renderThreeWasher(progress){if(!initThree()||Math.abs(progress-lastThreeProgress)<.006)return false;lastThreeProgress=progress;clearThreeGroup();const uSteps=72,vSteps=Math.max(2,Math.ceil(72*progress)),angle=Math.PI*2*progress;
function addSurface(radiusFunction,startColor,endColor,opacity){const positions=[],colors=[],indices=[],c0=new THREE.Color(startColor),c1=new THREE.Color(endColor);for(let i=0;i<=uSteps;i++){const t=i/uSteps,r=radiusFunction(t),color=c0.clone().lerp(c1,t);for(let j=0;j<=vSteps;j++){const a=angle*j/vSteps;positions.push(6*t-3,r*Math.cos(a),r*Math.sin(a));colors.push(color.r,color.g,color.b)}}for(let i=0;i<uSteps;i++)for(let j=0;j<vSteps;j++){const a=i*(vSteps+1)+j,b=a+vSteps+1;indices.push(a,b,a+1,b,b+1,a+1)}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geometry.setIndex(indices);geometry.computeVertexNormals();surfaceGroup.add(new THREE.Mesh(geometry,new THREE.MeshPhongMaterial({vertexColors:true,side:THREE.DoubleSide,shininess:48,specular:0x554422,transparent:true,opacity})));surfaceGroup.add(new THREE.LineSegments(new THREE.WireframeGeometry(geometry),new THREE.LineBasicMaterial({color:0x68471f,transparent:true,opacity:.12})))}
addSurface(radius3D,0xf4d35e,0xd85b39,.76);addSurface(t=>Math.max(.38,radius3D(t)*(.34+.05*Math.sin(Math.PI*t))),0x9f6b16,0x7d3028,.96);
if(progress<.985){const positions=[],indices=[];for(let i=0;i<=uSteps;i++){const t=i/uSteps,outer=radius3D(t),inner=Math.max(.38,outer*(.34+.05*Math.sin(Math.PI*t))),px=6*t-3;positions.push(px,inner*Math.cos(angle),inner*Math.sin(angle),px,outer*Math.cos(angle),outer*Math.sin(angle));if(i<uSteps){const a=2*i;indices.push(a,a+2,a+1,a+2,a+3,a+1)}}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setIndex(indices);geometry.computeVertexNormals();surfaceGroup.add(new THREE.Mesh(geometry,new THREE.MeshPhongMaterial({color:0x78c9cd,side:THREE.DoubleSide,transparent:true,opacity:.52,depthWrite:false})))}renderer.render(scene,camera);return true}
function frame(now){const e=(now-start)%T;if(e>=24000&&!threeFailed){threeStage.style.display='block';c.style.display='none';const q=e<32000?ease((e-24000)/8000):1;(washerMode?renderThreeWasher:renderThree)(q);if(threeReady){setThreeCamera(q);phase.textContent=e<32000?'7. Generación del sólido de revolución':'7. Sólido de revolución';if(!paused)requestAnimationFrame(frame);return}}threeStage.style.display='none';c.style.display='block';x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
if(e<3000){phase.textContent='1. Región plana';drawRegion()}
else if(e<6000){phase.textContent='2. Aproximación mediante rectángulos de ancho Δx';drawRegion(0,ease((e-3000)/3000))}
else if(e<8500){const q=ease((e-6000)/2500);phase.textContent=washerMode?'3. Vista tridimensional con radio exterior R(xᵢ) y radio interior r(xᵢ)':'3. Vista tridimensional con radio R(xᵢ)=f(xᵢ)';drawRegion(q,1);axis(q);wireframe(q*.75)}
else if(e<18500){phase.textContent=washerMode?'4. Cada rectángulo gira alrededor del eje x y genera una arandela de ancho Δx':'4. Cada rectángulo gira alrededor del eje x y genera un disco de ancho Δx';axis();wireframe(.42);const p=clamp((e-8500)/10000),done=Math.floor(p*N),part=p*N-done;discs(N,.92,.95,true,done);if(done<N)movingBand(done,ease(part))}
else if(e<22000){const q=ease((e-18500)/3500),n=Math.round(N+(48-N)*q);phase.textContent='5. Refinamiento de la partición: Δx → 0';axis(.8);discs(n,.98,.82,q<.62)}
else if(e<24000){const q=ease((e-22000)/2000);phase.textContent=washerMode?'6. Las arandelas delgadas determinan el perfil del sólido':'6. Los discos delgados determinan el perfil del sólido';axis(.65);discs(48,.98,1-q,true);wireframe(.2+.8*q,16)}
else if(e<32000){const q=ease((e-24000)/8000),fade=1-ease(clamp((q-.9)/.1)),front=Math.sin(-Math.PI*2*q)>=0;phase.textContent='7. Generación del sólido de revolución';axis(.62);if(!front)rotatingProfile(q,.52*fade);sweptSurface(q,.9);if(front)rotatingProfile(q,.82*fade)}
else{phase.textContent='7. Sólido de revolución';axis(.32);sweptSurface(1,1);x.fillStyle='#12324a';x.font='20px Arial';x.fillText('Sólido de revolución',500,570)}
if(!paused)requestAnimationFrame(frame)}
function setPausedState(shouldPause){if(shouldPause===paused)return;paused=shouldPause;if(paused){pauseAt=performance.now();toggle.textContent='Reproducir'}else{start+=performance.now()-pauseAt;toggle.textContent='Pausar';requestAnimationFrame(frame)}}
toggle.onclick=()=>setPausedState(!paused);restart.onclick=()=>{start=performance.now();if(paused){paused=false;toggle.textContent='Pausar';requestAnimationFrame(frame)}};window.addEventListener('message',event=>{if(event.data?.type==='disk-animation-control')setPausedState(Boolean(event.data.paused))});requestAnimationFrame(frame);
